name: Testy i GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: https://pmdkppkgnihscupgthxh.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ECMYbYdPvjY2pQE6Pbq4QQ_sgf0A0pp
          VITE_BASE_PATH: /kalendarz-oznaczen-/
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://pmdkppkgnihscupgthxh.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ECMYbYdPvjY2pQE6Pbq4QQ_sgf0A0pp
          VITE_BASE_PATH: /kalendarz-oznaczen-/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
