project_id = "kalendarz-oznaczen"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "https://patrycjap08.github.io/kalendarz-oznaczen-/index.html"
additional_redirect_urls = ["http://localhost:5173/kalendarz-oznaczen-/index.html", "https://patrycjap08.github.io/kalendarz-oznaczen-/index.html"]
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

# Each function validates identity itself; public publishable keys are not JWTs.
[functions.register]
verify_jwt = false
[functions.login]
verify_jwt = false
[functions.recover-password]
verify_jwt = false
[functions.delete-account]
verify_jwt = false
